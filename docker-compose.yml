services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tcg_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg_user} -d ${POSTGRES_DB:-tcg_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcg_user}:${POSTGRES_PASSWORD:-tcg_pass}@db:5432/${POSTGRES_DB:-tcg_db}
      PORT: ${BACKEND_PORT:-23000}
      NODE_ENV: development
      POKEMON_TCG_API_KEY: ${POKEMON_TCG_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-23000}:${BACKEND_PORT:-23000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-23000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_PORT: ${FRONTEND_PORT:-25173}
      BACKEND_PORT: ${BACKEND_PORT:-23000}
    ports:
      - "${FRONTEND_PORT:-25173}:${FRONTEND_PORT:-25173}"
    depends_on:
      - backend

volumes:
  pgdata:
